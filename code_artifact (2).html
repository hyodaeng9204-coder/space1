<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다이어트 대작전: 세 자매의 유혹</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .btn-arcade {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-arcade:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-arcade:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: floatSlow 2.6s ease-in-out infinite;
        }
        @keyframes pulseUrgent {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }
        .animate-urgent {
            animation: pulseUrgent 0.55s ease-in-out infinite;
        }
        @keyframes spinOnce {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-refresh {
            animation: spinOnce 0.45s ease-out;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-200 via-emerald-50 to-lime-100 h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 상단 HUD (게임 진행 중 표시) -->
    <header id="hud" class="hidden fixed top-0 left-0 right-0 z-20 px-3 py-2.5 sm:px-6 sm:py-3.5 flex items-center justify-between max-w-4xl mx-auto pointer-events-none gap-2">
        <!-- 현재 플레이어 & 목숨 하트 3개 -->
        <div class="bg-white/95 backdrop-blur-sm border-2 border-rose-400 rounded-2xl px-3.5 py-1.5 sm:px-4 sm:py-2 shadow-md flex items-center gap-2 pointer-events-auto">
            <div>
                <div id="hud-char-name" class="text-xs font-black text-gray-700 leading-tight">노혜빈</div>
                <div id="hud-hearts" class="text-lg sm:text-xl tracking-tight leading-none mt-0.5">❤️❤️❤️</div>
            </div>
        </div>

        <!-- 30초 카운트다운 타이머 -->
        <div id="timer-box" class="bg-white/95 backdrop-blur-sm border-2 border-amber-400 rounded-2xl px-4 py-1.5 sm:px-5 sm:py-2 shadow-md flex flex-col items-center min-w-[96px] sm:min-w-[118px]">
            <span class="text-[10px] sm:text-xs font-bold text-amber-600">남은 시간</span>
            <span id="timer-value" class="font-jua text-xl sm:text-2xl text-gray-800 leading-none mt-0.5">30.0초</span>
        </div>

        <!-- 건강식 점수 & 효과음 버튼 -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <div class="bg-white/95 backdrop-blur-sm border-2 border-emerald-500 rounded-2xl px-3.5 py-1.5 sm:px-4 sm:py-2 shadow-md text-right">
                <div class="text-[10px] sm:text-xs font-bold text-emerald-600">점수</div>
                <div class="font-jua text-xl sm:text-2xl text-emerald-600 leading-none mt-0.5">
                    <span id="score-value">0</span><span class="text-xs sm:text-sm text-gray-500 ml-0.5">점</span>
                </div>
            </div>
            <button id="sound-toggle" type="button" class="bg-white/95 hover:bg-gray-50 border-2 border-gray-300 rounded-2xl p-2 sm:p-2.5 shadow-md text-lg sm:text-xl transition active:scale-95 cursor-pointer" title="효과음 켜기/끄기">
                🔊
            </button>
        </div>
    </header>

    <!-- 게임 캔버스 -->
    <main class="w-full h-full flex items-center justify-center relative">
        <canvas id="gameCanvas" class="block w-full h-full cursor-none"></canvas>
    </main>

    <!-- 1. 시작 화면 오버레이 (세 자매 캐릭터 선택 + 실시간 랭킹 보드) -->
    <div id="start-screen" class="fixed inset-0 z-30 bg-black/45 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-xl w-full p-5 sm:p-7 shadow-2xl border-4 border-emerald-400 text-center relative my-auto">
            <div class="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-1 rounded-full mb-1.5">
                <span>⏱️ 30초 단판 승부</span>
                <span>•</span>
                <span>❤️❤️❤️ 기회 3번</span>
            </div>
            <h1 class="font-jua text-3xl sm:text-4xl text-gray-800 mb-1 tracking-tight animate-float">
                🥗 다이어트 대작전: 세 자매의 유혹
            </h1>
            <p class="text-gray-500 text-xs sm:text-sm mb-4">
                30초 동안 건강식(+1점)을 먹어 최고 기록에 도전하세요! 정크푸드 3번이면 돼지로 뿅!
            </p>

            <!-- 세 자매 캐릭터 선택 (오직 캔버스 프리뷰 이미지 + 캐릭터 이름만 표시) -->
            <div class="mb-4">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="font-jua text-base sm:text-lg text-gray-800">캐릭터 선택</span>
                    <span id="selected-char-badge" class="text-xs font-bold bg-emerald-500 text-white px-2.5 py-0.5 rounded-full">노혜빈</span>
                </div>
                <div class="grid grid-cols-3 gap-2.5 sm:gap-3.5" id="character-cards">
                    <!-- 노혜빈 -->
                    <button type="button" data-char="hyebin" class="char-card cursor-pointer rounded-2xl p-3 border-3 border-emerald-500 bg-emerald-50/90 ring-2 ring-emerald-400 transition-all flex flex-col items-center justify-center">
                        <canvas id="preview-hyebin" width="120" height="145" class="w-24 h-28 sm:w-28 sm:h-32"></canvas>
                        <div class="font-jua text-lg sm:text-xl text-gray-800 mt-1">노혜빈</div>
                    </button>

                    <!-- 노효정 -->
                    <button type="button" data-char="hyojeong" class="char-card cursor-pointer rounded-2xl p-3 border-2 border-gray-200 bg-gray-50 hover:bg-emerald-50/40 transition-all flex flex-col items-center justify-center">
                        <canvas id="preview-hyojeong" width="120" height="145" class="w-24 h-28 sm:w-28 sm:h-32"></canvas>
                        <div class="font-jua text-lg sm:text-xl text-gray-800 mt-1">노효정</div>
                    </button>

                    <!-- 노아 -->
                    <button type="button" data-char="noah" class="char-card cursor-pointer rounded-2xl p-3 border-2 border-gray-200 bg-gray-50 hover:bg-emerald-50/40 transition-all flex flex-col items-center justify-center">
                        <canvas id="preview-noah" width="120" height="145" class="w-24 h-28 sm:w-28 sm:h-32"></canvas>
                        <div class="font-jua text-lg sm:text-xl text-gray-800 mt-1">노아</div>
                    </button>
                </div>
            </div>

            <!-- 실시간 랭킹 보드 -->
            <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 mb-4 text-left">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base">🏆</span>
                        <span class="font-jua text-base text-gray-800">실시간 순위표</span>
                        <button type="button" id="refresh-rank-start-btn" class="text-xs bg-white hover:bg-slate-100 border border-slate-300 rounded-lg px-2 py-0.5 text-slate-600 font-bold flex items-center gap-1 cursor-pointer transition" title="순위 새로고침">
                            <span id="refresh-icon-start" class="inline-block">🔄</span> 새로고침
                        </button>
                    </div>
                    <button type="button" id="reset-rank-start-btn" class="text-[11px] text-gray-400 hover:text-rose-500 underline cursor-pointer">
                        초기화
                    </button>
                </div>
                <div id="start-ranking-list" class="max-h-32 overflow-y-auto space-y-1.5 pr-1 text-xs sm:text-sm">
                    <!-- JS로 실시간 렌더링 -->
                </div>
            </div>

            <button id="start-btn" type="button" class="btn-arcade w-full bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-600 hover:to-green-600 text-white font-jua text-xl sm:text-2xl py-3.5 rounded-2xl cursor-pointer">
                30초 도전 시작! 🚀
            </button>
        </div>
    </div>

    <!-- 2. 게임 종료 결과 & 실시간 갱신 랭킹 오버레이 -->
    <div id="result-screen" class="hidden fixed inset-0 z-30 bg-black/55 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div id="result-card" class="bg-white rounded-3xl max-w-lg w-full p-5 sm:p-7 shadow-2xl border-4 border-emerald-500 text-center my-auto">
            <!-- 결과 일러스트 (성공 시 자매 / 실패 시 분홍 돼지) -->
            <div class="flex justify-center mb-2">
                <div class="bg-gradient-to-b from-sky-100 to-emerald-50 rounded-full p-2 border-2 border-gray-200 shadow-inner">
                    <canvas id="result-char-canvas" width="135" height="145" class="w-24 h-28 sm:w-28 sm:h-32"></canvas>
                </div>
            </div>

            <div id="result-badge" class="inline-block bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-1 rounded-full mb-1">
                30초 생존 성공!
            </div>
            <h2 id="result-title" class="font-jua text-3xl sm:text-4xl text-gray-800 mb-1">
                다이어트 대성공! ✨
            </h2>
            <p id="result-desc" class="text-gray-600 text-xs sm:text-sm mb-4">
                유혹을 이겨내고 건강한 식단을 지켜냈습니다!
            </p>

            <!-- 획득 점수 요약 -->
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 mb-4 flex items-center justify-around">
                <div>
                    <div class="text-[11px] font-bold text-gray-500">도전 자매</div>
                    <div id="res-char-name" class="font-jua text-xl text-gray-800">노혜빈</div>
                </div>
                <div class="h-8 w-px bg-amber-200"></div>
                <div>
                    <div class="text-[11px] font-bold text-gray-500">최종 점수</div>
                    <div id="res-score" class="font-jua text-2xl text-emerald-600">0점</div>
                </div>
                <div class="h-8 w-px bg-amber-200"></div>
                <div>
                    <div class="text-[11px] font-bold text-gray-500">최종 결과</div>
                    <div id="res-status" class="font-jua text-lg text-emerald-600">생존성공 ✨</div>
                </div>
            </div>

            <!-- 실시간 새로고침된 랭킹 보드 -->
            <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 mb-5 text-left">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base">📊</span>
                        <span class="font-jua text-base text-gray-800">실시간 순위표</span>
                        <button type="button" id="refresh-rank-res-btn" class="text-xs bg-white hover:bg-slate-100 border border-slate-300 rounded-lg px-2 py-0.5 text-slate-600 font-bold flex items-center gap-1 cursor-pointer transition" title="순위 새로고침">
                            <span id="refresh-icon-res" class="inline-block">🔄</span> 새로고침
                        </button>
                    </div>
                    <span id="rank-change-pill" class="text-[11px] font-bold bg-amber-400 text-amber-950 px-2 py-0.5 rounded-full animate-bounce">
                        순위 갱신 완료!
                    </span>
                </div>
                <div id="result-ranking-list" class="max-h-40 overflow-y-auto space-y-1.5 pr-1 text-xs sm:text-sm">
                    <!-- JS로 실시간 렌더링 -->
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
                <button id="change-char-btn" type="button" class="btn-arcade bg-gray-100 hover:bg-gray-200 text-gray-800 font-jua text-lg sm:text-xl py-3.5 rounded-2xl cursor-pointer border border-gray-300">
                    캐릭터 변경 👧
                </button>
                <button id="retry-btn" type="button" class="btn-arcade bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-jua text-lg sm:text-xl py-3.5 rounded-2xl cursor-pointer">
                    다시 도전하기 🔄
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. Web Audio API 효과음 매니저
         */
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }

            playGood() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.11);
                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            }

            playBad() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(85, now + 0.22);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.24);
            }

            playPigTransform() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                // '뿅!' 변신음
                const popOsc = this.ctx.createOscillator();
                const popGain = this.ctx.createGain();
                popOsc.type = 'sine';
                popOsc.frequency.setValueAtTime(280, now);
                popOsc.frequency.exponentialRampToValueAtTime(1200, now + 0.14);
                popGain.gain.setValueAtTime(0.3, now);
                popGain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                popOsc.connect(popGain);
                popGain.connect(this.ctx.destination);
                popOsc.start(now);
                popOsc.stop(now + 0.16);

                // '꿀-꿀!' 콧소리 2회
                [0.2, 0.42].forEach((offset) => {
                    const t = now + offset;
                    const oinkOsc = this.ctx.createOscillator();
                    const oinkGain = this.ctx.createGain();
                    oinkOsc.type = 'sawtooth';
                    oinkOsc.frequency.setValueAtTime(135, t);
                    oinkOsc.frequency.linearRampToValueAtTime(190, t + 0.08);
                    oinkOsc.frequency.linearRampToValueAtTime(110, t + 0.16);
                    oinkGain.gain.setValueAtTime(0.25, t);
                    oinkGain.gain.exponentialRampToValueAtTime(0.01, t + 0.17);
                    oinkOsc.connect(oinkGain);
                    oinkGain.connect(this.ctx.destination);
                    oinkOsc.start(t);
                    oinkOsc.stop(t + 0.17);
                });
            }

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.1;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                });
            }
        }

        const sound = new SoundManager();

        /**
         * 2. 세 자매 캐릭터 프로필 (외형/체형 대비 극대화)
         */
        const CHARACTERS = {
            hyebin: {
                id: 'hyebin',
                name: '노혜빈',
                legH: 15,
                bodyH: 27,
                shoulderW: 17,      // 보통 슬림
                waistW: 15,
                armThick: 6.5,
                faceRx: 27,         // 갸름한 30대 초반 계란형 얼굴
                faceRy: 28,
                hairColor: '#3d281e'
            },
            hyojeong: {
                id: 'hyojeong',
                name: '노효정',
                legH: 23,           // 키가 가장 큼
                bodyH: 43,
                shoulderW: 25,      // 확실히 넓고 통통한 상체
                waistW: 26,
                armThick: 9.5,      // 통통한 팔
                faceRx: 31,         // 귀엽고 복스러운 통통한 볼살 얼굴형
                faceRy: 28,
                hairColor: '#291b15'
            },
            noah: {
                id: 'noah',
                name: '노아',
                legH: 19,           // 중간보다 약간 작은 키
                bodyH: 32,
                shoulderW: 13.5,    // 세 자매 중 가장 좁고 마른 어깨/허리
                waistW: 12,
                armThick: 5.0,      // 가장 가느다란 팔
                faceRx: 24.5,       // 제일 작고 갸름한 V라인 얼굴형
                faceRy: 27.5,
                hairColor: '#302019'
            }
        };

        let selectedCharId = 'hyebin';

        /**
         * 3. 실시간 랭킹 시스템 (localStorage + 자동/수동 새로고침)
         */
        const RANKING_STORAGE_KEY = 'sisters_diet_temptation_rank_v2';

        function loadRankings() {
            try {
                const raw = localStorage.getItem(RANKING_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {
                console.warn('랭킹 불러오기 오류:', e);
            }
            const defaults = [
                { id: 'seed-1', charId: 'hyojeong', name: '노효정', score: 17, isPig: false, timestamp: Date.now() - 300000 },
                { id: 'seed-2', charId: 'noah', name: '노아', score: 14, isPig: false, timestamp: Date.now() - 200000 },
                { id: 'seed-3', charId: 'hyebin', name: '노혜빈', score: 11, isPig: false, timestamp: Date.now() - 100000 }
            ];
            saveRankings(defaults);
            return defaults;
        }

        function saveRankings(list) {
            try {
                localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(list));
            } catch (e) {
                console.warn('랭킹 저장 오류:', e);
            }
        }

        function sortRankings(list) {
            return [...list].sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (a.isPig !== b.isPig) return a.isPig ? 1 : -1;
                return b.timestamp - a.timestamp;
            });
        }

        function recordNewScore(charId, finalScore, isPig) {
            const list = loadRankings();
            const entry = {
                id: 'entry-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                charId,
                name: CHARACTERS[charId].name,
                score: finalScore,
                isPig,
                timestamp: Date.now()
            };
            list.push(entry);
            const sorted = sortRankings(list).slice(0, 15);
            saveRankings(sorted);
            const newRankIndex = sorted.findIndex(item => item.id === entry.id);
            return { sorted, entryId: entry.id, rankNumber: newRankIndex + 1 };
        }

        function renderRankingBoard(containerId, highlightId = null) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const list = sortRankings(loadRankings());

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-4">기록이 없습니다. 첫 도전을 시작해보세요!</div>`;
                return;
            }

            container.innerHTML = list.map((item, idx) => {
                const rank = idx + 1;
                let rankIcon = `<span class="inline-block w-5 text-center font-bold text-gray-500">${rank}</span>`;
                if (rank === 1) rankIcon = `<span class="inline-block w-5 text-center text-base">🥇</span>`;
                else if (rank === 2) rankIcon = `<span class="inline-block w-5 text-center text-base">🥈</span>`;
                else if (rank === 3) rankIcon = `<span class="inline-block w-5 text-center text-base">🥉</span>`;

                const isHighlighted = item.id === highlightId;
                const rowClass = isHighlighted
                    ? 'bg-amber-100 border-2 border-amber-400 shadow-sm'
                    : 'bg-white border border-gray-100';

                const badgeHtml = item.isPig
                    ? `<span class="text-[10px] sm:text-xs bg-pink-100 text-pink-600 font-bold px-2 py-0.5 rounded-full">🐷 돼지변신</span>`
                    : `<span class="text-[10px] sm:text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">✨ 생존성공</span>`;

                return `
                    <div class="flex items-center justify-between px-2.5 py-1.5 rounded-xl transition-all ${rowClass}">
                        <div class="flex items-center gap-2">
                            ${rankIcon}
                            <span class="font-jua text-gray-800 text-sm sm:text-base">${item.name}</span>
                            ${badgeHtml}
                            ${isHighlighted ? '<span class="text-[10px] font-black text-amber-700">◀ NEW</span>' : ''}
                        </div>
                        <div class="font-jua text-sm sm:text-base ${item.isPig ? 'text-pink-600' : 'text-emerald-600'}">
                            ${item.score}점
                        </div>
                    </div>
                `;
            }).join('');
        }

        /**
         * 4. 음식 데이터 정의
         */
        const HEALTHY_FOODS = [
            { emoji: '🍎', name: '사과' },
            { emoji: '🥦', name: '브로콜리' },
            { emoji: '🍗', name: '닭가슴살' },
            { emoji: '🥗', name: '샐러드' },
            { emoji: '🥑', name: '아보카도' },
            { emoji: '🍌', name: '바나나' }
        ];

        const JUNK_FOODS = [
            { emoji: '🍜', name: '라면' },
            { emoji: '🍔', name: '햄버거' },
            { emoji: '🍕', name: '피자' },
            { emoji: '🍟', name: '감자튀김' },
            { emoji: '🍩', name: '도넛' }
        ];

        /**
         * 5. 캔버스 & 게임 상태 관리
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;

        const GAME_STATE = {
            MENU: 'MENU',
            PLAYING: 'PLAYING',
            TRANSFORMING: 'TRANSFORMING',
            RESULT: 'RESULT'
        };

        let currentState = GAME_STATE.MENU;
        let score = 0;
        let lives = 3;
        const GAME_DURATION = 30.0;
        let timeLeft = GAME_DURATION;
        let lastFrameTime = 0;

        const player = {
            x: width / 2,
            targetX: width / 2,
            groundY: height - 46,
            headRadius: 30,
            expression: 'normal',
            expressionTimer: 0,
            eatScale: 1,
            isPig: false,
            pigScale: 1
        };

        let fallingItems = [];
        let floatingTexts = [];
        let particles = [];
        let clouds = [];

        let lastSpawnTime = 0;
        let screenShakeTimer = 0;
        let redFlashAlpha = 0;
        let greenFlashAlpha = 0;
        let pinkFlashAlpha = 0;

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: 60 + Math.random() * (height * 0.4),
                    speed: 0.2 + Math.random() * 0.35,
                    scale: 0.65 + Math.random() * 0.65
                });
            }
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            player.groundY = height - 46;
            player.x = Math.max(player.headRadius + 20, Math.min(width - player.headRadius - 20, player.x));
            player.targetX = player.x;
        }

        window.addEventListener('resize', resizeCanvas);

        function updateTargetPosition(clientX) {
            const margin = player.headRadius + 16;
            player.targetX = Math.max(margin, Math.min(width - margin, clientX));
        }

        window.addEventListener('mousemove', (e) => updateTargetPosition(e.clientX));
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) updateTargetPosition(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updateTargetPosition(e.touches[0].clientX);
        }, { passive: true });

        function updateHUD() {
            document.getElementById('hud-char-name').textContent = CHARACTERS[selectedCharId].name;

            let heartsStr = '';
            for (let i = 0; i < 3; i++) {
                heartsStr += i < lives ? '❤️' : '🖤';
            }
            document.getElementById('hud-hearts').textContent = heartsStr;

            const timerEl = document.getElementById('timer-value');
            const timerBox = document.getElementById('timer-box');
            timerEl.textContent = `${Math.max(0, timeLeft).toFixed(1)}초`;
            if (timeLeft <= 5.0) {
                timerEl.classList.add('text-rose-600');
                timerBox.classList.add('border-rose-500', 'animate-urgent');
            } else {
                timerEl.classList.remove('text-rose-600');
                timerBox.classList.remove('border-rose-500', 'animate-urgent');
            }

            document.getElementById('score-value').textContent = score;
        }

        function startGame() {
            sound.init();
            score = 0;
            lives = 3;
            timeLeft = GAME_DURATION;
            fallingItems = [];
            floatingTexts = [];
            particles = [];

            player.isPig = false;
            player.pigScale = 1;
            player.expression = 'normal';
            player.eatScale = 1;

            lastSpawnTime = performance.now();
            lastFrameTime = performance.now();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            updateHUD();
            currentState = GAME_STATE.PLAYING;

            const charName = CHARACTERS[selectedCharId].name;
            spawnFloatingText(width / 2, height * 0.36, `${charName} 도전 시작! 30초 버티기!`, '#059669', 26);
        }

        function triggerPigTransformation() {
            currentState = GAME_STATE.TRANSFORMING;
            sound.playPigTransform();
            fallingItems = [];
            player.isPig = true;
            player.pigScale = 0.2;
            pinkFlashAlpha = 0.55;
            screenShakeTimer = 20;

            const headPos = getPlayerHeadCenter();
            for (let i = 0; i < 34; i++) {
                const angle = (Math.PI * 2 * i) / 34 + Math.random() * 0.2;
                const speed = 2.2 + Math.random() * 6.5;
                particles.push({
                    x: headPos.x,
                    y: headPos.y + 10,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    radius: 8 + Math.random() * 10,
                    color: i % 2 === 0 ? '#ffffff' : '#f472b6',
                    alpha: 1
                });
            }

            spawnFloatingText(headPos.x, headPos.y - 55, '펑!! 돼지로 뿅 변신했다 꿀꿀! 🐷', '#db2777', 26);

            setTimeout(() => {
                finishGame(true);
            }, 1350);
        }

        function finishGame(becamePig) {
            currentState = GAME_STATE.RESULT;
            document.getElementById('hud').classList.add('hidden');

            if (!becamePig) {
                sound.playSuccess();
            }

            const { entryId, rankNumber } = recordNewScore(selectedCharId, score, becamePig);

            const charObj = CHARACTERS[selectedCharId];
            const resultCard = document.getElementById('result-card');
            const badge = document.getElementById('result-badge');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const statusEl = document.getElementById('res-status');
            const rankPill = document.getElementById('rank-change-pill');

            document.getElementById('res-char-name').textContent = charObj.name;
            document.getElementById('res-score').textContent = `${score}점`;
            rankPill.textContent = `현재 ${rankNumber}위 반영!`;

            if (becamePig) {
                resultCard.classList.remove('border-emerald-500');
                resultCard.classList.add('border-pink-400');
                badge.className = 'inline-block bg-pink-100 text-pink-600 font-bold text-xs px-3 py-1 rounded-full mb-1';
                badge.textContent = '🐷 목숨 3개 소진 • 다이어트 실패!';
                title.textContent = '돼지로 뿅! 변신 엔딩 🐽';
                title.className = 'font-jua text-3xl sm:text-4xl text-pink-600 mb-1';
                desc.textContent = `고칼로리 음식을 3번 먹어 ${charObj.name}이(가) 귀여운 분홍 돼지로 변해버렸어요!`;
                statusEl.textContent = '돼지변신 🐷';
                statusEl.className = 'font-jua text-lg text-pink-600';
            } else {
                resultCard.classList.remove('border-pink-400');
                resultCard.classList.add('border-emerald-500');
                badge.className = 'inline-block bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-1 rounded-full mb-1';
                badge.textContent = '⏱️ 30초 생존 성공!';
                title.textContent = '다이어트 완벽 성공! ✨';
                title.className = 'font-jua text-3xl sm:text-4xl text-emerald-600 mb-1';
                desc.textContent = `30초 동안 끝까지 버텨내며 건강한 식단을 지켜냈습니다!`;
                statusEl.textContent = '생존성공 ✨';
                statusEl.className = 'font-jua text-lg text-emerald-600';
            }

            const resCanvas = document.getElementById('result-char-canvas');
            const resCtx = resCanvas.getContext('2d');
            resCtx.clearRect(0, 0, resCanvas.width, resCanvas.height);
            if (becamePig) {
                drawPigCharacter(resCtx, resCanvas.width / 2, resCanvas.height - 14, 1.05);
            } else {
                drawSisterCharacter(resCtx, resCanvas.width / 2, resCanvas.height - 14, selectedCharId, 'happy', 0.95, false);
            }

            renderRankingBoard('result-ranking-list', entryId);
            renderRankingBoard('start-ranking-list', entryId);

            document.getElementById('result-screen').classList.remove('hidden');
        }

        function spawnFood() {
            const elapsed = GAME_DURATION - timeLeft;
            const progress = Math.min(1, elapsed / GAME_DURATION);

            if (fallingItems.length >= 13) return;

            const junkRatio = 0.38 + progress * 0.14;
            const isJunk = Math.random() < junkRatio;
            const pool = isJunk ? JUNK_FOODS : HEALTHY_FOODS;
            const itemData = pool[Math.floor(Math.random() * pool.length)];

            const heightScale = Math.max(0.75, height / 750);
            const minSpeed = 3.0 + progress * 1.6;
            const maxSpeed = 6.2 + progress * 2.8;
            const speed = (minSpeed + Math.random() * (maxSpeed - minSpeed)) * heightScale;

            const radius = 24;
            const margin = 45;
            const x = margin + Math.random() * (width - margin * 2);

            fallingItems.push({
                x,
                y: -38,
                radius,
                speed,
                isJunk,
                emoji: itemData.emoji,
                name: itemData.name,
                rotation: (Math.random() - 0.5) * 0.4,
                rotSpeed: (Math.random() - 0.5) * 0.045
            });
        }

        function spawnFloatingText(x, y, text, color, size = 23) {
            floatingTexts.push({ x, y, text, color, size, alpha: 1, vy: -2.1 });
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
                const speed = 2.5 + Math.random() * 4.5;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    radius: 4 + Math.random() * 4,
                    color,
                    alpha: 1
                });
            }
        }

        function getPlayerHeadCenter() {
            const c = CHARACTERS[selectedCharId];
            if (player.isPig) {
                return { x: player.x, y: player.groundY - 46, r: 34 };
            }
            const headY = player.groundY - (c.legH + c.bodyH + c.faceRy - 4);
            return { x: player.x, y: headY, r: player.headRadius };
        }

        function update(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
            lastFrameTime = timestamp;

            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > width + 100) c.x = -100;
            });

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.14;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            if (screenShakeTimer > 0) screenShakeTimer--;
            if (redFlashAlpha > 0) redFlashAlpha = Math.max(0, redFlashAlpha - 0.03);
            if (greenFlashAlpha > 0) greenFlashAlpha = Math.max(0, greenFlashAlpha - 0.03);
            if (pinkFlashAlpha > 0) pinkFlashAlpha = Math.max(0, pinkFlashAlpha - 0.025);

            if (currentState === GAME_STATE.TRANSFORMING) {
                player.pigScale += (1 - player.pigScale) * 0.22;
                return;
            }

            if (currentState !== GAME_STATE.PLAYING) return;

            timeLeft -= dt;
            if (timeLeft <= 0) {
                timeLeft = 0;
                updateHUD();
                finishGame(false);
                return;
            }
            updateHUD();

            player.x += (player.targetX - player.x) * 0.3;

            if (player.expressionTimer > 0) {
                player.expressionTimer--;
                if (player.expressionTimer <= 0) player.expression = 'normal';
            }
            player.eatScale += (1 - player.eatScale) * 0.2;

            const elapsed = GAME_DURATION - timeLeft;
            const spawnInterval = Math.max(420, 680 - elapsed * 8.5);
            if (timestamp - lastSpawnTime > spawnInterval) {
                spawnFood();
                if (elapsed > 10 && Math.random() < 0.32) {
                    setTimeout(() => {
                        if (currentState === GAME_STATE.PLAYING) spawnFood();
                    }, 160);
                }
                lastSpawnTime = timestamp;
            }

            const head = getPlayerHeadCenter();

            for (let i = fallingItems.length - 1; i >= 0; i--) {
                const item = fallingItems[i];
                item.y += item.speed;
                item.rotation += item.rotSpeed;

                const dist = Math.hypot(item.x - head.x, item.y - head.y);

                if (dist < head.r + item.radius * 0.82) {
                    if (item.isJunk) {
                        lives -= 1;
                        sound.playBad();
                        player.expression = 'sad';
                        player.expressionTimer = 35;
                        player.eatScale = 0.85;
                        screenShakeTimer = 14;
                        redFlashAlpha = 0.38;

                        updateHUD();
                        fallingItems.splice(i, 1);

                        if (lives <= 0) {
                            triggerPigTransformation();
                            return;
                        } else {
                            spawnFloatingText(head.x, head.y - 45, `위험! ❤️ -1 (${item.name})`, '#e11d48', 22);
                            spawnParticles(item.x, item.y, '#fb7185');
                        }
                    } else {
                        score += 1;
                        sound.playGood();
                        player.expression = 'happy';
                        player.expressionTimer = 26;
                        player.eatScale = 1.22;
                        greenFlashAlpha = 0.22;

                        updateHUD();
                        spawnFloatingText(head.x, head.y - 45, `+1점! 💪 (${item.name})`, '#059669', 23);
                        spawnParticles(item.x, item.y, '#34d399');
                        fallingItems.splice(i, 1);
                    }
                    continue;
                }

                if (item.y > height + 50) {
                    fallingItems.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.save();

            if (screenShakeTimer > 0) {
                ctx.translate((Math.random() - 0.5) * 11, (Math.random() - 0.5) * 11);
            }

            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#bae6fd');
            skyGrad.addColorStop(0.7, '#ecfdf5');
            skyGrad.addColorStop(1, '#d9f99d');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

            const groundHeight = 46;
            ctx.fillStyle = '#84cc16';
            ctx.fillRect(0, height - groundHeight, width, groundHeight);
            ctx.fillStyle = '#65a30d';
            ctx.fillRect(0, height - groundHeight, width, 6);

            if (player.isPig) {
                drawPigCharacter(ctx, player.x, player.groundY, player.pigScale);
            } else {
                drawSisterCharacter(
                    ctx,
                    player.x,
                    player.groundY,
                    selectedCharId,
                    player.expression,
                    player.eatScale,
                    true
                );
            }

            fallingItems.forEach(item => drawFoodItem(item));

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = `900 ${ft.size}px 'Jua', sans-serif`;
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'white';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            if (redFlashAlpha > 0) {
                ctx.fillStyle = `rgba(244, 63, 94, ${redFlashAlpha})`;
                ctx.fillRect(0, 0, width, height);
            }
            if (greenFlashAlpha > 0) {
                ctx.fillStyle = `rgba(16, 185, 129, ${greenFlashAlpha})`;
                ctx.fillRect(0, 0, width, height);
            }
            if (pinkFlashAlpha > 0) {
                ctx.fillStyle = `rgba(244, 114, 182, ${pinkFlashAlpha})`;
                ctx.fillRect(0, 0, width, height);
            }

            ctx.restore();
        }

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.arc(24, -6, 32, 0, Math.PI * 2);
            ctx.arc(52, 0, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        /**
         * 6. 세 자매 캐릭터 전용 일러스트 렌더러
         * - 노혜빈: 작은 키, 30대 초반의 세련된 언니, 둥근 아줌마 파마 대신 자연스럽게 물결치는 S컬 히피펌, 가느다란 원형 안경, 민트 크롭 후드티
         * - 노효정: 가장 큰 키, 쇄골 아래 가슴 위 기장의 미디엄 롱 생머리(끝이 살짝 안으로 말림), 안경 없음, 통통한 얼굴형과 넓은 상체/팔, 핑크 트레이닝 집업
         * - 노아: 중간보다 약간 작은 키, 중단발 생머리, 안경 착용, 세 자매 중 가장 마르고 슬림한 V라인 얼굴형과 좁은 어깨/허리, 남색 교복 자켓+리본
         */
        function drawSisterCharacter(targetCtx, x, footY, charId, expression = 'normal', headScale = 1, showHitRing = false) {
            const c = CHARACTERS[charId];
            const bodyTopY = footY - c.legH - c.bodyH;
            const headCenterY = bodyTopY - (c.faceRy - 4);

            targetCtx.save();

            // 1. 발바닥 그림자
            targetCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            targetCtx.beginPath();
            targetCtx.ellipse(x, footY, c.shoulderW + 10, 6.5, 0, 0, Math.PI * 2);
            targetCtx.fill();

            // 2. 뒷머리 (자매별 헤어스타일 확실한 차별화)
            targetCtx.fillStyle = c.hairColor;
            if (charId === 'hyebin') {
                // 노혜빈: 30대 초반의 차분하고 트렌디한 S컬 웨이브 히피펌 (어깨선 미디엄 기장, 둥근 아줌마 파마 X)
                targetCtx.beginPath();
                targetCtx.moveTo(x - 27, headCenterY - 12);
                // 왼쪽 S컬 웨이브 흐름
                targetCtx.bezierCurveTo(x - 34, headCenterY + 2, x - 24, headCenterY + 14, x - 33, headCenterY + 28);
                targetCtx.bezierCurveTo(x - 37, headCenterY + 37, x - 26, headCenterY + 46, x - 22, headCenterY + 49);
                // 아래쪽 자연스러운 물결 끝단
                targetCtx.lineTo(x + 22, headCenterY + 49);
                // 오른쪽 S컬 웨이브 흐름
                targetCtx.bezierCurveTo(x + 26, headCenterY + 46, x + 37, headCenterY + 37, x + 33, headCenterY + 28);
                targetCtx.bezierCurveTo(x + 24, headCenterY + 14, x + 34, headCenterY + 2, x + 27, headCenterY - 12);
                targetCtx.arc(x, headCenterY - 10, 28, 0, Math.PI, true);
                targetCtx.closePath();
                targetCtx.fill();

                // 히피펌 결을 살려주는 은은한 웨이브 하이라이트 선
                targetCtx.strokeStyle = '#5c3e30';
                targetCtx.lineWidth = 1.6;
                targetCtx.beginPath();
                targetCtx.moveTo(x - 28, headCenterY + 4);
                targetCtx.quadraticCurveTo(x - 23, headCenterY + 15, x - 29, headCenterY + 27);
                targetCtx.quadraticCurveTo(x - 33, headCenterY + 36, x - 25, headCenterY + 45);
                targetCtx.moveTo(x + 28, headCenterY + 4);
                targetCtx.quadraticCurveTo(x + 23, headCenterY + 15, x + 29, headCenterY + 27);
                targetCtx.quadraticCurveTo(x + 33, headCenterY + 36, x + 25, headCenterY + 45);
                targetCtx.stroke();
            } else if (charId === 'hyojeong') {
                // 노효정: 허리까지 오지 않는 '쇄골 아래 가슴 위' 기장의 미디엄 롱 생머리 (끝이 살짝 안으로 말린 C컬 느낌)
                targetCtx.beginPath();
                targetCtx.moveTo(x - 33, headCenterY - 8);
                targetCtx.quadraticCurveTo(x - 36, headCenterY + 34, x - 27, headCenterY + 56);
                targetCtx.lineTo(x + 27, headCenterY + 56);
                targetCtx.quadraticCurveTo(x + 36, headCenterY + 34, x + 33, headCenterY - 8);
                targetCtx.arc(x, headCenterY - 8, 33, 0, Math.PI, true);
                targetCtx.closePath();
                targetCtx.fill();
            } else if (charId === 'noah') {
                // 노아: 단정한 중단발 생머리 (어깨 위 깔끔한 일자 중단발)
                targetCtx.beginPath();
                targetCtx.moveTo(x - 26, headCenterY - 8);
                targetCtx.lineTo(x - 29, headCenterY + 42);
                targetCtx.lineTo(x + 29, headCenterY + 42);
                targetCtx.lineTo(x + 26, headCenterY - 8);
                targetCtx.arc(x, headCenterY - 8, 26, 0, Math.PI, true);
                targetCtx.closePath();
                targetCtx.fill();
            }

            // 3. 다리 & 신발 (체형에 맞춘 다리 굵기 차이)
            const legW = charId === 'hyojeong' ? 10 : (charId === 'noah' ? 6.5 : 7.5);
            const legGap = charId === 'hyojeong' ? 6.5 : (charId === 'noah' ? 4 : 5);
            targetCtx.fillStyle = '#fed7aa';
            targetCtx.fillRect(x - legGap - legW, footY - c.legH, legW, c.legH - 3);
            targetCtx.fillRect(x + legGap, footY - c.legH, legW, c.legH - 3);

            // 신발
            targetCtx.fillStyle = charId === 'noah' ? '#1e293b' : '#ffffff';
            targetCtx.beginPath();
            targetCtx.roundRect(x - legGap - legW - 2, footY - 7, legW + 4, 7, 3.5);
            targetCtx.roundRect(x + legGap - 2, footY - 7, legW + 4, 7, 3.5);
            targetCtx.fill();
            targetCtx.strokeStyle = '#64748b';
            targetCtx.lineWidth = 1.4;
            targetCtx.stroke();

            // 4. 의상 (자매별 체형 차이와 스타일 반영)
            if (charId === 'hyebin') {
                // 노혜빈: 캐주얼한 민트색 크롭 후드티 + 데님 반바지/조거 느낌
                targetCtx.fillStyle = '#3b82f6'; // 하의 데님 쇼츠
                targetCtx.fillRect(x - c.waistW, bodyTopY + c.bodyH - 8, c.waistW * 2, 9);

                // 민트 크롭 후드 상의
                targetCtx.fillStyle = '#34d399';
                targetCtx.beginPath();
                targetCtx.roundRect(x - c.shoulderW, bodyTopY, c.shoulderW * 2, c.bodyH - 6, 10);
                targetCtx.fill();

                // 후드 끈 디테일
                targetCtx.strokeStyle = '#ffffff';
                targetCtx.lineWidth = 1.8;
                targetCtx.beginPath();
                targetCtx.moveTo(x - 4, bodyTopY + 3);
                targetCtx.lineTo(x - 4, bodyTopY + 12);
                targetCtx.moveTo(x + 4, bodyTopY + 3);
                targetCtx.lineTo(x + 4, bodyTopY + 12);
                targetCtx.stroke();
            } else if (charId === 'hyojeong') {
                // 노효정: 통통하고 동글동글한 상체가 돋보이는 핑크색 트레이닝 집업
                targetCtx.fillStyle = '#f472b6';
                targetCtx.beginPath();
                // 둥글고 넉넉한 상체 실루엣
                targetCtx.ellipse(x, bodyTopY + c.bodyH * 0.52, c.shoulderW + 2, c.bodyH * 0.54, 0, 0, Math.PI * 2);
                targetCtx.fill();

                // 집업 중앙 지퍼 라인 & 흰색 스트라이프
                targetCtx.strokeStyle = '#fce7f3';
                targetCtx.lineWidth = 2.5;
                targetCtx.beginPath();
                targetCtx.moveTo(x, bodyTopY + 2);
                targetCtx.lineTo(x, bodyTopY + c.bodyH - 1);
                targetCtx.stroke();
            } else if (charId === 'noah') {
                // 노아: 제일 마르고 슬림한 핏의 남색 교복 자켓 + 치마 + 리본
                targetCtx.fillStyle = '#334155'; // 슬림 플리츠 스커트
                targetCtx.beginPath();
                targetCtx.moveTo(x - c.waistW, bodyTopY + c.bodyH - 12);
                targetCtx.lineTo(x + c.waistW, bodyTopY + c.bodyH - 12);
                targetCtx.lineTo(x + c.waistW + 4.5, bodyTopY + c.bodyH + 3);
                targetCtx.lineTo(x - c.waistW - 4.5, bodyTopY + c.bodyH + 3);
                targetCtx.closePath();
                targetCtx.fill();

                // 슬림 핏 남색 교복 자켓
                targetCtx.fillStyle = '#1e293b';
                targetCtx.beginPath();
                targetCtx.roundRect(x - c.shoulderW, bodyTopY, c.shoulderW * 2, c.bodyH - 9, 8);
                targetCtx.fill();

                // 흰색 셔츠 칼라 & 빨간 교복 리본
                targetCtx.fillStyle = '#ffffff';
                targetCtx.beginPath();
                targetCtx.moveTo(x - 6, bodyTopY);
                targetCtx.lineTo(x + 6, bodyTopY);
                targetCtx.lineTo(x, bodyTopY + 13);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = '#e11d48';
                targetCtx.beginPath();
                targetCtx.arc(x, bodyTopY + 7.5, 3, 0, Math.PI * 2);
                targetCtx.fill();
            }

            // 양팔 (체형에 비례하는 팔 두께)
            targetCtx.strokeStyle = '#fed7aa';
            targetCtx.lineWidth = c.armThick;
            targetCtx.lineCap = 'round';
            targetCtx.beginPath();
            targetCtx.moveTo(x - c.shoulderW + 1, bodyTopY + 7);
            targetCtx.lineTo(x - c.shoulderW - 9, bodyTopY + 19);
            targetCtx.moveTo(x + c.shoulderW - 1, bodyTopY + 7);
            targetCtx.lineTo(x + c.shoulderW + 9, bodyTopY + 19);
            targetCtx.stroke();

            // 5. 얼굴 영역 (세 자매가 닮은 이목구비 + 각자 다른 얼굴 윤곽)
            targetCtx.save();
            targetCtx.translate(x, headCenterY);
            targetCtx.scale(headScale, headScale);

            if (showHitRing) {
                targetCtx.strokeStyle = expression === 'sad'
                    ? 'rgba(244, 63, 94, 0.45)'
                    : 'rgba(16, 185, 129, 0.35)';
                targetCtx.lineWidth = 2.5;
                targetCtx.setLineDash([5, 5]);
                targetCtx.beginPath();
                targetCtx.arc(0, 0, player.headRadius + 5, 0, Math.PI * 2);
                targetCtx.stroke();
                targetCtx.setLineDash([]);
            }

            // 얼굴 윤곽 (혜빈: 계란형 / 효정: 동글동글 통통 볼살 / 노아: 제일 갸름한 V라인)
            targetCtx.fillStyle = '#ffedd5';
            targetCtx.strokeStyle = '#fdba74';
            targetCtx.lineWidth = 2.3;
            targetCtx.beginPath();
            if (charId === 'noah') {
                // 노아: 턱선이 갸름하게 좁아지는 슬림 V라인
                targetCtx.moveTo(-c.faceRx, -4);
                targetCtx.arc(0, -4, c.faceRx, Math.PI, 0, false);
                targetCtx.quadraticCurveTo(c.faceRx, 16, 0, c.faceRy);
                targetCtx.quadraticCurveTo(-c.faceRx, 16, -c.faceRx, -4);
            } else if (charId === 'hyojeong') {
                // 노효정: 볼살이 통통하게 오른 귀엽고 동그란 얼굴형
                targetCtx.ellipse(0, 1, c.faceRx, c.faceRy, 0, 0, Math.PI * 2);
            } else {
                // 노혜빈: 세련된 계란형 얼굴
                targetCtx.ellipse(0, 0, c.faceRx, c.faceRy, 0, 0, Math.PI * 2);
            }
            targetCtx.fill();
            targetCtx.stroke();

            // 앞머리 (자매별 개성)
            targetCtx.fillStyle = c.hairColor;
            if (charId === 'hyebin') {
                // 노혜빈: 30대 초반 느낌의 자연스러운 여신 가르마 웨이브 앞머리 (잔머리 컬 포인트)
                targetCtx.beginPath();
                targetCtx.arc(0, -3, c.faceRx + 1, Math.PI * 1.04, Math.PI * 1.96);
                targetCtx.quadraticCurveTo(10, -13, 2, -22);
                targetCtx.quadraticCurveTo(-10, -13, -(c.faceRx + 1), -3);
                targetCtx.fill();

                // 옆머리 자연스러운 S컬 잔머리 웨이브
                targetCtx.strokeStyle = c.hairColor;
                targetCtx.lineWidth = 3.2;
                targetCtx.lineCap = 'round';
                targetCtx.beginPath();
                targetCtx.moveTo(-c.faceRx + 1, -2);
                targetCtx.quadraticCurveTo(-c.faceRx - 4, 8, -c.faceRx + 2, 18);
                targetCtx.moveTo(c.faceRx - 1, -2);
                targetCtx.quadraticCurveTo(c.faceRx + 4, 8, c.faceRx - 2, 18);
                targetCtx.stroke();
            } else if (charId === 'hyojeong') {
                // 노효정: 부드럽게 옆으로 넘긴 차분한 앞머리
                targetCtx.beginPath();
                targetCtx.arc(0, -3, c.faceRx + 1, Math.PI * 1.05, Math.PI * 1.95);
                targetCtx.quadraticCurveTo(6, -12, -4, -21);
                targetCtx.quadraticCurveTo(-16, -12, -(c.faceRx + 1), -3);
                targetCtx.fill();
            } else {
                // 노아: 단정한 학생 시스루 뱅 앞머리
                targetCtx.beginPath();
                targetCtx.arc(0, -4, c.faceRx + 0.5, Math.PI * 1.06, Math.PI * 1.94);
                targetCtx.lineTo(19, -11);
                targetCtx.lineTo(-19, -11);
                targetCtx.closePath();
                targetCtx.fill();
            }

            // 세 자매 닮은 볼터치
            targetCtx.fillStyle = 'rgba(251, 113, 133, 0.42)';
            const blushX = charId === 'hyojeong' ? 18 : 14;
            targetCtx.beginPath();
            targetCtx.ellipse(-blushX, 6, 4.8, 2.6, 0, 0, Math.PI * 2);
            targetCtx.ellipse(blushX, 6, 4.8, 2.6, 0, 0, Math.PI * 2);
            targetCtx.fill();

            // 세 자매 닮은 초롱초롱 눈매 & 표정
            if (expression === 'happy') {
                targetCtx.strokeStyle = '#1f2937';
                targetCtx.lineWidth = 2.6;
                targetCtx.lineCap = 'round';
                targetCtx.beginPath();
                targetCtx.moveTo(-13, -1);
                targetCtx.lineTo(-9.5, -5.5);
                targetCtx.lineTo(-6, -1);
                targetCtx.moveTo(6, -1);
                targetCtx.lineTo(9.5, -5.5);
                targetCtx.lineTo(13, -1);
                targetCtx.stroke();

                targetCtx.fillStyle = '#f43f5e';
                targetCtx.beginPath();
                targetCtx.arc(0, 8, 8.5, 0, Math.PI);
                targetCtx.fill();
            } else if (expression === 'sad') {
                targetCtx.strokeStyle = '#1f2937';
                targetCtx.lineWidth = 2.6;
                targetCtx.lineCap = 'round';
                targetCtx.beginPath();
                targetCtx.moveTo(-13, -5);
                targetCtx.lineTo(-7.5, -1);
                targetCtx.lineTo(-13, 3);
                targetCtx.moveTo(13, -5);
                targetCtx.lineTo(7.5, -1);
                targetCtx.lineTo(13, 3);
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.arc(0, 14, 6.5, Math.PI * 1.15, Math.PI * 1.85);
                targetCtx.stroke();
            } else {
                targetCtx.fillStyle = '#1f2937';
                targetCtx.beginPath();
                targetCtx.arc(-9.5, -1, 3.6, 0, Math.PI * 2);
                targetCtx.arc(9.5, -1, 3.6, 0, Math.PI * 2);
                targetCtx.fill();

                targetCtx.fillStyle = '#ffffff';
                targetCtx.beginPath();
                targetCtx.arc(-10.6, -2.1, 1.3, 0, Math.PI * 2);
                targetCtx.arc(8.4, -2.1, 1.3, 0, Math.PI * 2);
                targetCtx.fill();

                targetCtx.fillStyle = '#fb7185';
                targetCtx.beginPath();
                targetCtx.arc(0, 8.5, 5.2, 0, Math.PI);
                targetCtx.fill();
            }

            // 안경 착용 (노혜빈: 세련된 얇은 원형 금테 안경 / 노아: 단정한 학생 뿔테 안경 / 노효정: 없음)
            if (charId === 'hyebin') {
                targetCtx.strokeStyle = '#b45309';
                targetCtx.lineWidth = 1.7;
                targetCtx.fillStyle = 'rgba(255, 255, 255, 0.14)';
                targetCtx.beginPath();
                targetCtx.arc(-9.8, -1, 7.8, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.arc(9.8, -1, 7.8, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.moveTo(-2.0, -1);
                targetCtx.lineTo(2.0, -1);
                targetCtx.stroke();
            } else if (charId === 'noah') {
                targetCtx.strokeStyle = '#1e293b';
                targetCtx.lineWidth = 2.2;
                targetCtx.fillStyle = 'rgba(255, 255, 255, 0.16)';
                targetCtx.beginPath();
                targetCtx.arc(-9.5, -1, 7.5, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.arc(9.5, -1, 7.5, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.beginPath();
                targetCtx.moveTo(-2.0, -1);
                targetCtx.lineTo(2.0, -1);
                targetCtx.stroke();
            }

            targetCtx.restore();
            targetCtx.restore();
        }

        /**
         * 7. 분홍 돼지 변신 캐릭터 일러스트
         */
        function drawPigCharacter(targetCtx, x, footY, scale = 1) {
            targetCtx.save();
            targetCtx.translate(x, footY);
            targetCtx.scale(scale, scale);

            targetCtx.fillStyle = 'rgba(0, 0, 0, 0.18)';
            targetCtx.beginPath();
            targetCtx.ellipse(0, 0, 38, 9, 0, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = '#f9a8d4';
            targetCtx.strokeStyle = '#db2777';
            targetCtx.lineWidth = 3;
            targetCtx.beginPath();
            targetCtx.ellipse(0, -28, 36, 26, 0, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.fillStyle = '#f472b6';
            targetCtx.beginPath();
            targetCtx.roundRect(-22, -10, 11, 10, 4);
            targetCtx.roundRect(11, -10, 11, 10, 4);
            targetCtx.fill();
            targetCtx.stroke();

            const headY = -56;
            targetCtx.fillStyle = '#fbcfe8';
            targetCtx.beginPath();
            targetCtx.arc(0, headY, 28, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.fillStyle = '#f472b6';
            targetCtx.beginPath();
            targetCtx.moveTo(-22, headY - 16);
            targetCtx.lineTo(-28, headY - 34);
            targetCtx.lineTo(-10, headY - 24);
            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.beginPath();
            targetCtx.moveTo(22, headY - 16);
            targetCtx.lineTo(28, headY - 34);
            targetCtx.lineTo(10, headY - 24);
            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.strokeStyle = '#831843';
            targetCtx.lineWidth = 2.5;
            targetCtx.beginPath();
            targetCtx.arc(-11, headY - 6, 4.5, 0, Math.PI * 1.7);
            targetCtx.stroke();
            targetCtx.beginPath();
            targetCtx.arc(11, headY - 6, 4.5, 0, Math.PI * 1.7);
            targetCtx.stroke();

            targetCtx.fillStyle = '#f472b6';
            targetCtx.beginPath();
            targetCtx.ellipse(0, headY + 6, 12, 8.5, 0, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.fillStyle = '#831843';
            targetCtx.beginPath();
            targetCtx.arc(-4.5, headY + 6, 2.3, 0, Math.PI * 2);
            targetCtx.arc(4.5, headY + 6, 2.3, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.font = "900 15px 'Jua', sans-serif";
            targetCtx.textAlign = 'center';
            targetCtx.fillStyle = '#db2777';
            targetCtx.fillText('꿀꿀~ 🐷', 0, headY - 38);

            targetCtx.restore();
        }

        function drawFoodItem(item) {
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.rotate(item.rotation);

            ctx.fillStyle = item.isJunk
                ? 'rgba(254, 205, 211, 0.78)'
                : 'rgba(209, 250, 229, 0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '34px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.emoji, 0, 2);

            ctx.restore();
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }

        /**
         * 8. 시작 화면 세 자매 프리뷰 & UI 이벤트 바인딩
         */
        function renderCharacterPreviews() {
            ['hyebin', 'hyojeong', 'noah'].forEach((id) => {
                const pCanvas = document.getElementById(`preview-${id}`);
                if (!pCanvas) return;
                const pCtx = pCanvas.getContext('2d');
                pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
                drawSisterCharacter(pCtx, pCanvas.width / 2, pCanvas.height - 8, id, 'normal', 0.94, false);
            });
        }

        function selectCharacter(charId) {
            selectedCharId = charId;
            document.getElementById('selected-char-badge').textContent = CHARACTERS[charId].name;

            document.querySelectorAll('.char-card').forEach((card) => {
                if (card.dataset.char === charId) {
                    card.className = 'char-card cursor-pointer rounded-2xl p-3 border-3 border-emerald-500 bg-emerald-50/90 ring-2 ring-emerald-400 transition-all flex flex-col items-center justify-center scale-[1.02]';
                } else {
                    card.className = 'char-card cursor-pointer rounded-2xl p-3 border-2 border-gray-200 bg-gray-50 hover:bg-emerald-50/40 transition-all flex flex-col items-center justify-center opacity-85 hover:opacity-100';
                }
            });
        }

        document.querySelectorAll('.char-card').forEach((card) => {
            card.addEventListener('click', () => {
                sound.init();
                sound.playGood();
                selectCharacter(card.dataset.char);
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        document.getElementById('change-char-btn').addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            renderRankingBoard('start-ranking-list');
            document.getElementById('start-screen').classList.remove('hidden');
            currentState = GAME_STATE.MENU;
        });

        // 수동 랭킹 새로고침 버튼 (시작 화면 & 결과 화면)
        document.getElementById('refresh-rank-start-btn').addEventListener('click', () => {
            const icon = document.getElementById('refresh-icon-start');
            icon.classList.remove('spin-refresh');
            void icon.offsetWidth;
            icon.classList.add('spin-refresh');
            renderRankingBoard('start-ranking-list');
        });

        document.getElementById('refresh-rank-res-btn').addEventListener('click', () => {
            const icon = document.getElementById('refresh-icon-res');
            icon.classList.remove('spin-refresh');
            void icon.offsetWidth;
            icon.classList.add('spin-refresh');
            renderRankingBoard('result-ranking-list');
        });

        document.getElementById('reset-rank-start-btn').addEventListener('click', () => {
            localStorage.removeItem(RANKING_STORAGE_KEY);
            renderRankingBoard('start-ranking-list');
            renderRankingBoard('result-ranking-list');
        });

        document.getElementById('sound-toggle').addEventListener('click', (e) => {
            const isOn = sound.toggle();
            e.currentTarget.textContent = isOn ? '🔊' : '🔇';
        });

        window.onload = function () {
            resizeCanvas();
            initClouds();
            renderCharacterPreviews();
            selectCharacter('hyebin');
            renderRankingBoard('start-ranking-list');
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
